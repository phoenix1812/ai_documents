services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.0}
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  paperless:
    image: ${PAPERLESS_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx:3.1.3}
    container_name: paperless
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      ai-worker:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST:-db}
      PAPERLESS_DBNAME: ${POSTGRES_DB:-paperless}
      PAPERLESS_DBUSER: ${POSTGRES_USER:-paperless}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}

      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_LANGUAGES: deu eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8000}

      PAPERLESS_CONSUMER_POLLING_INTERVAL: ${PAPERLESS_CONSUMER_POLLING_INTERVAL:-10}
      PAPERLESS_CONSUMER_STABILITY_DELAY: ${PAPERLESS_CONSUMER_STABILITY_DELAY:-5}

      PAPERLESS_FILENAME_FORMAT: >
        {{ created_year }}/{{ correspondent }}/{{ document_type }}/{{ title }}

      PAPERLESS_OCR_ROTATE_PAGES: true
      PAPERLESS_OCR_DESKEW: true
      PAPERLESS_OCR_CLEAN: clean

      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post-consume-ai-worker.sh
      AI_WORKER_TRIGGER_URL: http://ai-worker:8080/process

    volumes:
      - ${PAPERLESS_CONSUME_PATH:-./paperless-consume}:/usr/src/paperless/consume
      - ${PAPERLESS_DATA_PATH:-./paperless-data}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_PATH:-./paperless-media}:/usr/src/paperless/media
      - ./scripts:/usr/src/paperless/scripts:ro

  ai-worker:
    build: .
    container_name: ai-worker
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8000}
      TRIGGER_PORT: 8080
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8080/ready", timeout=5
          ).read()
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

  ai-review-ui:
    build: .
    container_name: ai-review-ui
    restart: unless-stopped
    depends_on:
      - ai-worker
      - paperless
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      PAPERLESS_URL: http://paperless:8000
      REVIEW_UI_PORT: 8090
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    command: >
      uvicorn app.review_ui:app --host 0.0.0.0 --port 8090
